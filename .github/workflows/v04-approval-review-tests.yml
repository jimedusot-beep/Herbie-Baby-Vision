name: Baby Vision V0.4 approval-gate regression
on:
  push:
    branches:
      - review/baby-vision-v04-approval-gates-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    name: All synthetic Coding Bee tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signed-approval test dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Offline regression suite — no Ollama, Docker or project execution
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
