name: Baby Vision V0.3 - proposal safety tests
on:
  pull_request:
    paths:
      - 'agents/proposal_bridge.py'
      - 'agents/readonly_investigate.py'
      - 'agents/repository_search.py'
      - 'tests/test_proposal_bridge.py'
      - '.github/workflows/baby-vision-v03-proposal-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proposal-tests:
    name: Offline synthetic proposal checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression suite (no Ollama, no app code)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
