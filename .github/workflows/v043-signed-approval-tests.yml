name: Baby Vision V0.4.3 - signed approvals (non-executing)
on:
  pull_request:
    paths:
      - 'agents/signed_approval.py'
      - 'tests/test_signed_approval_v043.py'
      - 'docs/SIGNED_APPROVALS_V043.md'
      - '.github/workflows/v043-signed-approval-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signature-tests:
    name: Signed approval validation / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install signing-verification dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Run all synthetic regression tests (no model, Docker or project execution)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p 'test_*.py' -q
