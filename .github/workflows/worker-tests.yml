name: Baby Vision worker tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signed-approval test dependency
        run: python -m pip install 'cryptography>=43,<47'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run worker boundary and disposable-checkout tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify old gateway dashboard and M1 mobile dashboard
        run: node --test tests/test_review_dashboard.cjs tests/test_m1_mobile_review.cjs
