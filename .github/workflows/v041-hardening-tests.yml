name: Baby Vision V0.4.1 safety regressions
on:
  pull_request:
    paths:
      - 'agents/artifact_io.py'
      - 'agents/readonly_investigate.py'
      - 'agents/proposal_bridge.py'
      - 'agents/coding_bee.py'
      - 'agents/approval_gate.py'
      - 'tests/test_v041_hardening.py'
      - 'tests/test_coding_bee.py'
      - '.github/workflows/v041-hardening-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-hardening:
    name: Hardened review-only suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install signed-approval test dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Read-only synthetic regression suite (no Ollama or Docker)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
