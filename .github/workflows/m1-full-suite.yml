name: Baby Vision M1 consolidated full suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-consolidated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-m1-regressions:
    name: Full offline M1 suite (Python ${{ matrix.python-version }})
    # Python 3.9 has a setup-python build for Ubuntu 22.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - name: Check out this review commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only crypto dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Run all Python unit and integration tests (simulated model)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensure test run did not alter tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          echo 'Tracked source unchanged by offline tests.'
